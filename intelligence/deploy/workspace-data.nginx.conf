# Include inside the existing server block, alongside the workspace location.
# Exact matching leaves every other API and static route on the main service.
location = /ocean-intelligence/api/data {
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/json;
    proxy_pass http://127.0.0.1:3104/api/data;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
