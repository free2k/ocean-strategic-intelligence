<!doctype html><html lang="zh-CN" data-system="low-carbon"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共享订阅管理 · 碳索智研</title><link rel="icon" href="low-carbon-logo.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="low-carbon.css"></head><body><main class="source-page"><a href="./#sources">← 返回低碳信息感知</a><h1>共享订阅源管理</h1><p>统一维护来源，两套系统分别采集、清洗与保存文章。</p><div class="shared-note">此页新增、编辑、取消的订阅配置会同步影响原站。文章采集、分类规则、研究成果分别保存；“采集到低碳版”只启动低碳版任务。</div><p id="feedback" role="status">正在读取订阅配置…</p><form id="rss-form"><label>RSS 名称<input name="name" required maxlength="150"></label><label>RSS 地址<input name="url" type="url" required></label><button class="primary">添加共享 RSS</button></form><form id="mp-form"><label>公众号原始文章链接<input name="articleUrl" type="url" required placeholder="https://mp.weixin.qq.com/…"></label><button class="primary">添加共享公众号订阅</button></form><div class="tools"><button id="refresh">更新共享账号列表</button><button id="collect">采集到低碳版</button></div><h2>公众号与 X</h2><input id="search" type="search" aria-label="搜索订阅" placeholder="搜索账号名称或地址"><div id="subscriptions"></div><h2>RSS 与官方来源</h2><div id="rss"></div><dialog id="editor"><form id="edit-form"><input name="id" type="hidden"><label>名称<input name="name" required></label><label>RSS 地址<input name="url" type="url" required></label><button class="primary">保存到共享配置</button><button type="button" id="cancel">取消</button></form></dialog></main><script type="module" src="source-management.js"></script></body></html>
