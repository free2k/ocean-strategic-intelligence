<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>海洋能源 · 行业数据洞察</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/echarts.js" defer></script>
  <script src="/entry.js" type="module"></script>
</head>
<body>
  <aside>
    <a class="brand" href="/">≈ <span>海洋能源<small>RESEARCH / QUANT LAB</small></span></a>
    <div class="side-label">行业数据洞察</div>
    <nav id="industries" aria-label="领域"></nav>
    <div class="side-note"><span class="live-dot"></span> 本地预览</div>
  </aside>
  <main>
    <div class="toolbar">
      <div class="workspace-tabs">
        <div class="tabs primary-tabs" role="group" aria-label="分析视图">
          <button data-tab="inventory" class="active" aria-pressed="true">数据池</button>
          <button data-tab="charts" aria-pressed="false">图表分析</button>
          <button data-tab="coverage" aria-pressed="false">资料分布</button>
        </div>
        <div class="tabs utility-tabs" role="group" aria-label="数据工具">
          <button data-tab="templates" aria-pressed="false">图表演示</button>
          <button data-tab="audit" aria-pressed="false">分类记录</button>
        </div>
      </div>
      <span id="scope" hidden></span>
    </div>
    <header>
      <span id="status" role="status" title="数据更新时间（北京时间）">加载中…</span>
      <button id="refresh" type="button" aria-label="刷新数据">刷新 ↻</button>
    </header>
    <section id="metrics" class="metrics" aria-label="数据概览"></section>
    <section id="content" aria-label="分析内容"></section>
  </main>
</body>
</html>
