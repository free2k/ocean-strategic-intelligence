# Ready source views are read outside the research calculation event loop.
location = /ocean-intelligence/api/sensing-page {
    proxy_pass http://127.0.0.1:3106/api/sensing-page;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 502 504 = @kb_ocean_inactive;
    proxy_read_timeout 120s;
}
location = /low-carbon/api/sensing-page {
    proxy_pass http://127.0.0.1:3206/api/sensing-page;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 502 504 = @kb_low_carbon_inactive;
    proxy_read_timeout 120s;
}
location = /ocean-intelligence/sensing.css { proxy_pass http://127.0.0.1:3106/assets/sensing.css; }
location = /ocean-intelligence/research-layout.css { proxy_pass http://127.0.0.1:3106/assets/research-layout.css; }
location = /ocean-intelligence/ui-controls.css { proxy_pass http://127.0.0.1:3106/assets/ui-controls.css; }
location = /low-carbon/sensing.css { proxy_pass http://127.0.0.1:3206/assets/sensing.css; }
location = /low-carbon/research-layout.css { proxy_pass http://127.0.0.1:3206/assets/research-layout.css; }
location = /low-carbon/ui-controls.css { proxy_pass http://127.0.0.1:3206/assets/ui-controls.css; }

# Paginated evidence and saved period reports have a separate read thread.
location = /ocean-intelligence/api/evidence-page { proxy_pass http://127.0.0.1:3107/api/evidence-page; }
location = /ocean-intelligence/api/evidence-period { proxy_pass http://127.0.0.1:3107/api/evidence-period; }
location = /ocean-intelligence/api/evidence-report { proxy_pass http://127.0.0.1:3107/api/evidence-report; }
location = /ocean-intelligence/api/evidence-report-document { proxy_pass http://127.0.0.1:3107/api/evidence-report-document; }
location = /low-carbon/api/evidence-page { proxy_pass http://127.0.0.1:3207/api/evidence-page; }
location = /low-carbon/api/evidence-period { proxy_pass http://127.0.0.1:3207/api/evidence-period; }
location = /low-carbon/api/evidence-report { proxy_pass http://127.0.0.1:3207/api/evidence-report; }
location = /low-carbon/api/evidence-report-document { proxy_pass http://127.0.0.1:3207/api/evidence-report-document; }

# Object lists, the evidence replay and same-release counts share one ready view.
location = /ocean-intelligence/api/monitor-page { proxy_pass http://127.0.0.1:3108/api/monitor-page; }
location = /ocean-intelligence/api/monitor-summary { proxy_pass http://127.0.0.1:3108/api/monitor-summary; }
location = /low-carbon/api/monitor-page { proxy_pass http://127.0.0.1:3208/api/monitor-page; }
location = /low-carbon/api/monitor-summary { proxy_pass http://127.0.0.1:3208/api/monitor-summary; }

# Versioned country maps and assessments never queue behind research calculations.
location = /ocean-intelligence/api/dashboard-page { proxy_pass http://127.0.0.1:3109/api/dashboard-page; }
location = /ocean-intelligence/api/dashboard-freshness { proxy_pass http://127.0.0.1:3109/api/dashboard-freshness; }
location = /ocean-intelligence/world.json { proxy_pass http://127.0.0.1:3109/world.json; }
location = /low-carbon/api/dashboard-page { proxy_pass http://127.0.0.1:3209/api/dashboard-page; }
location = /low-carbon/api/dashboard-freshness { proxy_pass http://127.0.0.1:3209/api/dashboard-freshness; }
location = /low-carbon/world.json { proxy_pass http://127.0.0.1:3209/world.json; }

# Entry scripts and their public imports also bypass research calculations.
location ~ ^/ocean-intelligence/(?<ocean_entry_asset>(?:(?:app|workspace-read|system-api|subsystem-switch|multi-select|strategy-workbench|country-dossier|monitor-overview|object-browser|navigation|home|change-signals|industry-topics|preview|sensing|globe|file-intake|country-map|x-evidence-view|statistical-views|interactions|enhancements|object-supplement|object-fields|dossier-view|country-ranking|country-assessment|dashboard-codec|classification-current|research-replay|classification-review|period-reports|rule-editor|brief-view|period-charts|processing-runs|system-profile)\.(?:js|mjs)|strategy/[a-z-]+\.js|quant/(?:(?:app|catalog-read|entry|template-demos|iea-view|official-charts|chart-views|chart-rotation|chart-caption|data-workbench|data-import|charts|echarts)\.js|style\.css|index\.html)|low-carbon/(?:taxonomy|lexicon)\.mjs))$ {
    proxy_pass http://127.0.0.1:3109/assets/$ocean_entry_asset;
}
location ~ ^/low-carbon/(?<lc_entry_asset>(?:(?:app|workspace-read|system-api|subsystem-switch|multi-select|strategy-workbench|country-dossier|monitor-overview|object-browser|navigation|home|change-signals|industry-topics|preview|sensing|globe|file-intake|country-map|x-evidence-view|statistical-views|interactions|enhancements|object-supplement|object-fields|dossier-view|country-ranking|country-assessment|dashboard-codec|classification-current|research-replay|classification-review|period-reports|rule-editor|brief-view|period-charts|processing-runs|system-profile)\.(?:js|mjs)|strategy/[a-z-]+\.js|quant/(?:(?:app|catalog-read|entry|template-demos|iea-view|official-charts|chart-views|chart-rotation|chart-caption|data-workbench|data-import|charts|echarts)\.js|style\.css|index\.html)|low-carbon/(?:taxonomy|lexicon)\.mjs))$ {
    proxy_pass http://127.0.0.1:3209/assets/$lc_entry_asset;
}

location = /ocean-intelligence/api/dashboard-themes { proxy_pass http://127.0.0.1:3109/api/dashboard-themes; }
location = /low-carbon/api/dashboard-themes { proxy_pass http://127.0.0.1:3209/api/dashboard-themes; }

# Data pools and research catalogues have a dedicated calculation worker.
location = /ocean-intelligence/api/insight-page { proxy_pass http://127.0.0.1:3110/api/insight-page; }
location = /ocean-intelligence/quant/api/page { proxy_pass http://127.0.0.1:3110/quant/api/page; }
location = /ocean-intelligence/quant/api/card { proxy_pass http://127.0.0.1:3110/quant/api/card; }
location = /ocean-intelligence/quant/api/catalog { proxy_pass http://127.0.0.1:3110/quant/api/catalog; }
location = /ocean-intelligence/api/strategy/catalog { proxy_pass http://127.0.0.1:3110/api/strategy/catalog; }
location = /low-carbon/api/insight-page { proxy_pass http://127.0.0.1:3210/api/insight-page; }
location = /low-carbon/quant/api/page { proxy_pass http://127.0.0.1:3210/quant/api/page; }
location = /low-carbon/quant/api/card { proxy_pass http://127.0.0.1:3210/quant/api/card; }
location = /low-carbon/quant/api/catalog { proxy_pass http://127.0.0.1:3210/quant/api/catalog; }
location = /low-carbon/api/strategy/catalog { proxy_pass http://127.0.0.1:3210/api/strategy/catalog; }
