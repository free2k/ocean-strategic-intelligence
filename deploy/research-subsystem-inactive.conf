# Include inside the existing Nginx server. Each research proxy references its
# own named fallback with: proxy_intercept_errors on; error_page 502 503 504 = @...;
location @kb_ocean_inactive {
    default_type application/json;
    if ($request_uri ~ "^/ocean-intelligence/(api/|quant/api/)") { return 409 '{"error":"海洋能源当前未启用，请通过右上角切换子系统。","code":"SUBSYSTEM_INACTIVE"}'; }
    return 302 /subsystem-switch.html?system=ocean;
}
location @kb_low_carbon_inactive {
    default_type application/json;
    if ($request_uri ~ "^/low-carbon/(api/|quant/api/)") { return 409 '{"error":"低碳研究当前未启用，请通过右上角切换子系统。","code":"SUBSYSTEM_INACTIVE"}'; }
    return 302 /subsystem-switch.html?system=low-carbon;
}
