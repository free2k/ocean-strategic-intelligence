# Isolated static demonstration. No proxy or application endpoints.
location = /haijian-preview {
    return 302 /haijian-preview/;
}

location ^~ /haijian-preview/ {
    alias /var/www/haijian-preview/;
    index index.html;
    autoindex off;
    charset utf-8;
    limit_except GET {
        deny all;
    }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
